<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>

  <body>
    <div class="sections-container">
      <header class="top-nav-section">
        <nav class="top-nav-div">
          <img
            class="pandamarket-logo"
            src="./images/Pandamarket_logo.png"
            alt="판다마켓 로고 이미지"
          />
          <button class="login-button">
            <a href="/login.html">
              <img
                src="./images/btn_small_48.png"
                alt="버튼
            이미지"
              />
            </a>
          </button>
        </nav>
      </header>

      <section class="trade-section">
        <div>
          <img src="./images/trade_section.png" alt="거래 섹션 이미지" />
        </div>
      </section>

      <section class="bestseller-section">
        <div>
          <img
            src="./images/bestseller_section.png"
            alt="인기 상품 섹션 이미지"
          />
        </div>
      </section>

      <section class="search-section">
        <div>
          <img src="./images/search_section.png" alt="검색 섹션 이미지" />
        </div>
      </section>

      <section class="register-section">
        <div>
          <img src="./images/register_section.png" alt="등록 섹션 이미지" />
        </div>
      </section>

      <section class="ad-section">
        <div class="ad">
          <img src="./images/ad_section.png" alt="광고 섹션 이미지" />
        </div>
      </section>

      <footer>
        <nav class="bottom-nav">
          <div class="bottom-nav-texts">
            <span class="codeit-text">@codeit - 2024</span>
            <div class="information-links">
              <a class="Privacy-Policy-a" href="/privacy">Privacy Policy</a>
              <a class="FAQ-a" href="/faq">FAQ</a>
            </div>
            <div class="bottom-nav-icons">
              <a href="/facebook" target="_blank">
                <img src="./images/ic_facebook.png" alt="facebook_icon_image" />
              </a>
              <a href="/twitter" target="_blank">
                <img src="./images/ic_twitter.png" alt="twitter_icon_image" />
              </a>
              <a href="/youtube" target="_blank">
                <img src="./images/ic_youtube.png" alt="youtube_icon_image" />
              </a>
              <a href="/instagram" target="_blank">
                <img
                  src="./images/ic_instagram.png"
                  alt="instagram_icon_image"
                />
              </a>
            </div>
          </div>
        </nav>
      </footer>
    </div>
  </body>
</html>
