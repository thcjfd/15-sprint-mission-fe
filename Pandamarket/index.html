<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>

  <body>
    <div class="sections-container">
      <header class="top-nav-section">
        <nav class="top-nav-div">
          <img
            class="pandamarket-logo"
            src="/images/index/Pandamarket_logo.png"
            alt="판다마켓 로고 이미지"
          />
          <div class="login-button">
            <a href="/login.html">
              <img
                src="/images/index/btn_small_48.png"
                alt="구경하러 가기 버튼"
              />
            </a>
          </div>
        </nav>
      </header>

      <section class="trade-section">
        <div class="button-container">
          <img src="/images/index/trade_section.png" alt="거래 섹션 이미지" />
          <a href="/items"></a>
        </div>
      </section>

      <section class="bestseller-section">
        <div>
          <img
            src="/images/index/bestseller_section.png"
            alt="인기 상품 섹션 이미지"
          />
        </div>
      </section>

      <section class="search-section">
        <div>
          <img src="/images/index/search_section.png" alt="검색 섹션 이미지" />
        </div>
      </section>

      <section class="register-section">
        <div>
          <img
            src="/images/index/register_section.png"
            alt="등록 섹션 이미지"
          />
        </div>
      </section>

      <section class="ad-section">
        <div class="ad">
          <img src="/images/index/ad_section.png" alt="광고 섹션 이미지" />
        </div>
      </section>

      <footer>
        <nav class="bottom-nav">
          <div class="bottom-nav-texts">
            <div class="codeit-text">@codeit - 2024</div>
            <div class="information-links">
              <a class="Privacy-Policy-a" href="/privacy">Privacy Policy</a>
              <a class="FAQ-a" href="/faq">FAQ</a>
            </div>
            <div class="bottom-nav-icons">
              <a href="/facebook" target="_blank">
                <img
                  src="/images/index/ic_facebook.png"
                  alt="페이스북 아이콘"
                />
              </a>
              <a href="/twitter" target="_blank">
                <img src="/images/index/ic_twitter.png" alt="트위터 아이콘" />
              </a>
              <a href="/youtube" target="_blank">
                <img src="/images/index/ic_youtube.png" alt="유튜브 아이콘" />
              </a>
              <a href="/instagram" target="_blank">
                <img
                  src="/images/index/ic_instagram.png"
                  alt="인스타그램 아이콘"
                />
              </a>
            </div>
          </div>
        </nav>
      </footer>
    </div>
  </body>
</html>
