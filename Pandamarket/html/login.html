<!doctype html>
<html>
  <head lang="ko">
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <main>
      <a href="/" class="logo-link">
        <img src="/resources/login/logo.png" alt="판다마켓 로고" />
      </a>
      <form class="login-form">
        <div class="login-form-inputs">
          <label for="">이메일</label>
          <input type="email" placeholder="이메일을 입력해주세요" />
          <label for="">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              class="password-input-field"
              placeholder="비밀번호를 입력해주세요"
            />
            <button type="button" class="visibility-button">
              <img
                src="/resources/login/pswd_visibility_off.png"
                alt="패스워드 보기"
              />
            </button>
          </div>
        </div>
        <button type="submit" class="login-button">로그인</button>
      </form>
      <div class="SSO">
        간편 로그인하기
        <div class="SSO-icons">
          <a href="https://www.google.com/">
            <img src="/resources/login/google_icon.png" alt="구글 아이콘" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img
              src="/resources/login/kakaotalk_icon.png"
              alt="카카오톡 아이콘"
            />
          </a>
        </div>
      </div>
      <div class="login">
        판다마켓이 처음이신가요?
        <a href="/html/signup.html">회원가입</a>
      </div>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
